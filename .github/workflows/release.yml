# Builds a release when you push a version tag, for example:
#   git tag v1.1.0 && git push origin v1.1.0
#
# The release gets minimalio-child.zip, with a "minimalio-child" folder inside,
# ready for Appearance → Themes → Add New Theme → Upload Theme.
#
# There is deliberately NO update.json: a child theme holds the website's own
# custom code, so it must never be updated automatically.
#
# The tag must match "Version:" in style.css.

name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

env:
  SLUG: minimalio-child

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Check version number
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          HEADER=$(grep -m1 -E '^Version:' style.css | awk '{print $NF}')
          if [ "$HEADER" != "$VERSION" ]; then
            echo "::error::style.css says Version: $HEADER, but the tag is $GITHUB_REF_NAME"; exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Build theme zip
        # Files marked export-ignore in .gitattributes are left out.
        run: git archive --format=zip --prefix="$SLUG/" -o "$SLUG.zip" HEAD

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" "$SLUG.zip" --title "$VERSION" --generate-notes
